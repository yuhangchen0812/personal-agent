name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Run offline verification groups
        run: |
          .\.venv\Scripts\python.exe -X utf8 -B codex/verify_acceptance.py --output-dir .personal/ci
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: .personal/ci/
          include-hidden-files: true
